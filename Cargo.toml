[workspace]
resolver = "2"
members = ["engine", "server", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
sonari-engine = { path = "engine" }

# 解码 / 播放 / DSP —— 对标 ocenaudio 的 libiaudio / libqtocenmixer2 / libdspb
symphonia = { version = "0.6", features = ["all-codecs", "all-formats"] }
cpal = "0.18"
rustfft = "6.4"
realfft = "3.5"
rubato = "5"
ebur128 = "0.1"

# Tauri 2
tauri = { version = "2", features = [] }
tauri-build = "2"
tauri-plugin-dialog = "2"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
